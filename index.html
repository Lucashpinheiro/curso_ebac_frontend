<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Modulo 7</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <header></header>
    <main>
        <section class="container">
            <div class="formulario">
                <h1>Formulário Modulo 7</h1>
                <form id="form-number">
                    <label>Campo A</label>
                    <input type="number" id="number-a" min="0" max="10" required >
                    <p class="mensagem-erro"></p>
                    <label>Campo B</label>
                    <input type="number" id="number-b" min="0" max="10" required >
                    <button type="submit" id="btn">Enviar</button>
                </form>
                <p class="mensagem-sucesso">
                
                </p>
            </div>
        </section>
    </main>
    <script src="./main.js"></script>
</body>
</html>
