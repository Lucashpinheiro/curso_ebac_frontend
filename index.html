<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Jquery Plugins</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="container">
        <form>
            <h1>Cadastro</h1>
            <div class="form-campo">
                <label for="nome">Nome</label>
                    <input type="text" placeholder="Nome Completo" id="nome">
            </div>
            <div class="form-campo">
                <label for="email">E-mail</label>
                    <input type="text" placeholder="E-mail" id="email">
            </div>
            <div class="form-campo">
                <label for="telefone">Telefone</label>
                    <input type="tel" placeholder="Telefone" id="telefone">
            </div>
            <div class="form-campo">
                <label for="cpf">Cpf</label>
                    <input type="text" placeholder="Cpf" id="cpf">
            </div>
            <div class="form-campo">
                <label for="endereco">Endereco</label>
                    <input type="text" placeholder="Endereço completo" id="endereco">
            </div>
            <div class="form-campo">
                <label for="numero">Numero</label>
                    <input type="text" placeholder="Numero" id="numero">
            </div>
            <div class="form-campo">
                <label for="cep">Cep</label>
                    <input type="text" placeholder="Cep" id="cep">
            </div>
            <div class="btn">
                <button type="submit">Enviar</button>
            </div>       
        </form>
    </section>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="./js/jquery.mask.min.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
